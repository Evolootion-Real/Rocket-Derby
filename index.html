<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Derby</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js and Cannon.js for 3D & Realistic Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <!-- MAIN MENU SCREEN -->
    <div id="main-menu" class="screen">
        <h1>🚗 ROCKET DERBY</h1>
        <div class="menu-buttons">
            <button onclick="startGame('freeplay')">Freeplay</button>
            <button onclick="startGame('bot')">Play vs Bot</button>
            <button onclick="openScreen('garage-screen')">Garage</button>
            <button onclick="openScreen('settings-screen')">Settings & Bindings</button>
        </div>
    </div>

    <!-- GARAGE SCREEN -->
    <div id="garage-screen" class="screen hidden">
        <h2>Car Garage</h2>
        <p>Customize your ride:</p>
        <div class="customization-options">
            <label>Car Color: <input type="color" id="car-color-picker" value="#ff0000" onchange="updateCarColor(this.value)"></label>
        </div>
        <button onclick="openScreen('main-menu')">Back to Menu</button>
    </div>

    <!-- SETTINGS / KEYBINDINGS SCREEN -->
    <div id="settings-screen" class="screen hidden">
        <h2>Controls & Keybindings</h2>
        <div class="bindings-list">
            <p>Throttle Up: <span id="bind-throttleUp" class="key-bind" onclick="rebindKey('throttleUp')">W</span></p>
            <p>Throttle Down: <span id="bind-throttleDown" class="key-bind" onclick="rebindKey('throttleDown')">S</span></p>
            <p>Steer Left: <span id="bind-steerLeft" class="key-bind" onclick="rebindKey('steerLeft')">A</span></p>
            <p>Steer Right: <span id="bind-steerRight" class="key-bind" onclick="rebindKey('steerRight')">D</span></p>
            <p>Boost: <span id="bind-boost" class="key-bind" onclick="rebindKey('boost')">Shift</span></p>
            <p>Jump: <span id="bind-jump" class="key-bind" onclick="rebindKey('jump')">Space</span></p>
        </div>
        <button onclick="openScreen('main-menu')">Back to Menu</button>
    </div>

    <!-- GAME HUD -->
    <div id="game-hud" class="hidden">
        <div id="scoreboard">Blue: <span id="blue-score">0</span> | Red: <span id="red-score">0</span></div>
        <div id="boost-meter">Boost: <span id="boost-val">100</span>%</div>
        <button id="pause-btn" onclick="returnToMenu()">Menu</button>
    </div>

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <script src="game.js"></script>
</body>
</html>
